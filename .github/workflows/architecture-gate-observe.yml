name: Architecture Gate Observation

permissions: {}

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      allowed: ${{ steps.authorize.outputs.allowed }}
      reason: ${{ steps.authorize.outputs.reason }}
    steps:
      - id: authorize
        shell: bash
        env:
          EXPECTED_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail

          gate_json="$(jq -er '
            def invalid: error("invalid pull_request_target event payload");
            def valid_id: type == "number" and . > 0 and floor == . and . <= 9007199254740991;
            if type != "object" then invalid
            elif (.action | type) != "string" then invalid
            elif (.action | IN("opened", "synchronize", "reopened", "ready_for_review", "edited") | not) then invalid
            elif (.pull_request | type) != "object" then invalid
            elif (.pull_request.base | type) != "object" then invalid
            elif (.pull_request.base.repo | type) != "object" then invalid
            elif (.pull_request.head | type) != "object" then invalid
            elif (.pull_request.head.repo | type) != "object" then invalid
            elif (.pull_request.base.ref | type) != "string" then invalid
            elif (.pull_request.draft | type) != "boolean" then invalid
            elif (env.EXPECTED_REPOSITORY_ID | test("^[1-9][0-9]*$") | not) then invalid
            elif (.repository.id | valid_id | not) then invalid
            elif (.pull_request.base.repo.id | valid_id | not) then invalid
            elif (.pull_request.head.repo.id | valid_id | not) then invalid
            elif (.repository.id | tostring) != env.EXPECTED_REPOSITORY_ID then invalid
            elif (.pull_request.base.repo.id | tostring) != env.EXPECTED_REPOSITORY_ID then invalid
            else
              . as $event
              | ($event.pull_request.head.repo.id == $event.pull_request.base.repo.id) as $same_repository
              | ($event.pull_request.base.ref == "main"
                 and $event.pull_request.draft == false
                 and $same_repository) as $allowed
              | {
                  allowed: ($allowed | tostring),
                  reason: (if ($same_repository | not) then "fork"
                           elif $event.pull_request.base.ref != "main" then "wrong_base"
                           elif $event.pull_request.draft then "draft"
                           else "eligible" end),
                  action: $event.action,
                  draft: ($event.pull_request.draft | tostring),
                  association: (if ($event.pull_request.author_association | IN("OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR", "FIRST_TIMER", "FIRST_TIME_CONTRIBUTOR", "MANNEQUIN", "NONE"))
                                then $event.pull_request.author_association else "UNKNOWN" end),
                  base: (if $event.pull_request.base.ref == "main" then "main" else "other" end)
                }
            end
          ' "$GITHUB_EVENT_PATH")"

          allowed="$(jq -r '.allowed' <<<"$gate_json")"
          reason="$(jq -r '.reason' <<<"$gate_json")"
          action="$(jq -r '.action' <<<"$gate_json")"
          draft="$(jq -r '.draft' <<<"$gate_json")"
          association="$(jq -r '.association' <<<"$gate_json")"
          base="$(jq -r '.base' <<<"$gate_json")"

          printf 'Authorization preflight: allowed=%s reason=%s action=%s base=%s draft=%s association=%s\n' \
            "$allowed" "$reason" "$action" "$base" "$draft" "$association"
          printf 'allowed=%s\nreason=%s\n' "$allowed" "$reason" >> "$GITHUB_OUTPUT"
          {
            printf '### Architecture Gate authorization preflight\n\n'
            printf -- '- allowed: `%s`\n- reason: `%s`\n- action: `%s`\n- base: `%s`\n- draft: `%s`\n- PR author association: `%s`\n' \
              "$allowed" "$reason" "$action" "$base" "$draft" "$association"
          } >> "$GITHUB_STEP_SUMMARY"

  diagnose-authorization:
    needs: authorize
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Validate and report propagated authorization outputs
        shell: bash
        env:
          AUTH_RESULT: ${{ needs.authorize.result }}
          ALLOWED: ${{ needs.authorize.outputs.allowed }}
          REASON: ${{ needs.authorize.outputs.reason }}
        run: |
          set -euo pipefail

          propagation_status="valid"
          if [[ -z "$AUTH_RESULT" || -z "$ALLOWED" || -z "$REASON" ]]; then
            propagation_status="missing"
          elif [[ "$AUTH_RESULT" != "success" ]]; then
            propagation_status="invalid"
          elif [[ "$ALLOWED" == "true" && "$REASON" != "eligible" ]]; then
            propagation_status="invalid"
          elif [[ "$ALLOWED" == "false" && ! "$REASON" =~ ^(draft|wrong_base|fork)$ ]]; then
            propagation_status="invalid"
          elif [[ "$ALLOWED" != "true" && "$ALLOWED" != "false" ]]; then
            propagation_status="invalid"
          fi

          if [[ "$propagation_status" != "valid" ]]; then
            printf 'Authorization output propagation: %s; model review must remain skipped.\n' "$propagation_status"
            printf '### Authorization output propagation\n\nStatus: `%s`; model review must remain skipped.\n' "$propagation_status" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          printf 'Authorization output propagation: result=%s allowed=%s reason=%s\n' \
            "$AUTH_RESULT" "$ALLOWED" "$REASON"
          printf '### Authorization output propagation\n\n- Authorize result: `%s`\n- allowed: `%s`\n- reason: `%s`\n' \
            "$AUTH_RESULT" "$ALLOWED" "$REASON" >> "$GITHUB_STEP_SUMMARY"

  architecture-gate-observe:
    needs: [authorize, diagnose-authorization]
    if: ${{ needs.authorize.result == 'success' && needs.authorize.outputs.allowed == 'true' && needs.diagnose-authorization.result == 'success' }}
    permissions:
      contents: read
      pull-requests: write
    uses: flair-agency/architecture-gatekeeper/.github/workflows/architecture-gate-consumer.yml@c6c45da24d755ddd51b3a595e614242f869ec3ad
    with:
      policy-path: .codex/gatekeeper/ci-policy.json
      prompt-path: .codex/gatekeeper/ci-prompt.md
      schema-path: .codex/gatekeeper/decision.schema.json
      validation-path: .codex/gatekeeper/decision.validation.json
      protected-review-instructions: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
