name: Bug report
description: Report an issue in repository content or an existing prototype.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This project is in the design and pre-pilot phase. Reports are handled on a best-effort basis, with no response-time guarantee.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue and where you encountered it.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps or context
      description: Include steps, relevant context, and expected behavior.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and references
      description: Link relevant files, issues, or sources. Do not include secrets or personal data.
    validations:
      required: false
